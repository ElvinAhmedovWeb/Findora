<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ftranslator — fast translator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#886FFF" id="meta-theme-color">
<style>
  :root{
    --accent: #886FFF;
    --bg: #fbfbff;
    --card: #fff;
    --muted:#6c7280;
    --text:#0f1724;
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  [data-theme="dark"]{ --bg:#071021; --card:#0b1220; --muted:#9aa3b2; --text:#e8f0ff; }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#fff);display:flex;align-items:center;justify-content:center;}
  .wrap{width:94%;max-width:920px;padding:18px;}
  .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 10px 30px rgba(2,6,23,0.06);}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .brand{display:flex;align-items:center;gap:12px}
  .logo-svg{width:44px;height:44px;flex:0 0 44px;border-radius:10px;}
  .title{font-weight:800;color:var(--text)}
  .controls{display:flex;gap:8px;align-items:center;}
  .lang-select, .btn{padding:10px 12px;border-radius:10px;border:1px solid #eee;background:transparent;cursor:pointer}
  .btn{font-weight:700;background:var(--accent);color:#fff;border:none}
  textarea{width:100%;min-height:120px;border-radius:10px;border:1px solid #eee;padding:12px;resize:vertical;font-size:15px}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .result{margin-top:12px;padding:12px;border-radius:10px;border:1px solid #eef2ff;background:linear-gradient(180deg,var(--card),#fcfcff)}
  .meta{font-size:13px;color:var(--muted);margin-top:8px}
  .small{font-size:13px;color:var(--muted)}
  @media (max-width:520px){ .top{flex-direction:column;align-items:flex-start} .controls{width:100%;justify-content:space-between} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="brand">
          <svg class="logo-svg" viewBox="0 0 84 84" xmlns="http://www.w3.org/2000/svg">
            <circle cx="42" cy="42" r="40" fill="#886FFF"/>
            <text x="50%" y="54%" text-anchor="middle" font-family="Inter,ui-sans-serif" font-weight="800" font-size="40" fill="#fff">F</text>
          </svg>
          <div>
            <div class="title">Ftranslator</div>
            <div class="small">Quick translations — mobile-ready</div>
          </div>
        </div>

        <div class="controls">
          <select id="toLang" class="lang-select" aria-label="Target language"></select>
          <button id="themeToggle" class="lang-select">Theme</button>
        </div>
      </div>

      <label class="small">Input</label>
      <textarea id="srcText" placeholder="Type or paste text here..."></textarea>

      <div class="row">
        <select id="fromLang" class="lang-select" aria-label="Source language">
          <option value="auto">Detect language</option>
        </select>
        <button id="translateBtn" class="btn">Translate</button>
        <button id="copyBtn" class="lang-select">Copy</button>
        <button id="speakBtn" class="lang-select">Speak</button>
      </div>

      <div id="status" class="meta" style="display:none"></div>

      <div id="resultWrap" class="result" hidden>
        <div id="resultText" style="white-space:pre-wrap"></div>
        <div class="meta" id="resultMeta"></div>
      </div>
    </div>
  </div>

  <script>window.API_BASE = window.API_BASE || window.location.origin;</script>
  <script src="ftranslator.js" defer></script>
</body>
</html>
