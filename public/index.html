<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Findora — Your Mini Search</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="icon" href="logo2.png">
<!-- Inter font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --accent: #7969EE;
    --muted: #6c7280;
    --card: #ffffff;
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  html,body{
    height:100%;
    margin:0;
    background: linear-gradient(180deg,#fbfbff,#f1f0ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font, 'Inter', sans-serif);
  }
  .wrap{width:92%;max-width:920px;text-align:center;padding:24px;}
  .logo{
    display:inline-flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    margin-bottom:18px;
  }
  .brand-name{font-weight:800;font-size:36px;color:var(--accent);letter-spacing:-0.5px;}
  .search-card{
    background:var(--card);
    padding:22px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(16,24,40,0.06);
  }
  .search-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .search-input{
    width:min(720px,72vw);
    padding:12px 16px;
    border-radius:999px;
    border:1px solid #e9e9f2;
    font-size:16px;
    outline:none;
  }
  .btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;min-width:44px;}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(121,105,238,0.18);border-radius: 25px;}
  .btn-muted{background:#f3f4f6;color:var(--muted);}
  .controls{margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--muted);}
  .results{margin-top:18px;text-align:left;max-width:880px;margin-left:auto;margin-right:auto;}
  .result-item{background:#fff;padding:12px;border-radius:10px;border:1px solid #eef2ff;margin-bottom:10px;}
  .meta{color:var(--muted);font-size:13px;margin-top:6px;}
  .small{font-size:13px;color:var(--muted);}
  .status{padding:10px;text-align:center;color:var(--muted);}
  @media (max-width:520px){
    .brand-name{font-size:28px;}
    .search-input{font-size:15px;}
  }
  /* 🟣 CSS: bunu style.css və ya <style> içində saxla */
#loading-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0d0b19; /* dark background */
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

.loader {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 1.5s infinite ease-in-out;
}

.f-logo {
  font-family: "Inter", ui-sans-serif;
  font-size: 72px;
  font-weight: 800;
  color: #ffffff;
  background: linear-gradient(135deg, #7b68ee, #9b8cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -2px;
}

/* pulsation animation */
@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.15);
    opacity: 0.6;
  }
}

/* when hide */
/* existing #loading-screen, .loader, .f-logo, @keyframes pulse remain the same */

/* improved hidden state */
#loading-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none; /* clicks go through after hidden */
}

/* if you want a tiny blur-to-content effect while fading, optional */
body.loading-active {
  overflow: hidden; /* prevent scroll while loading */
}

</style>
</head>
 <!--🟣 HTML: bunu <body> içində ən yuxarıya əlavə et -->
<div id="loading-screen">
  <div class="loader">
    <img src="logo.png" style="height: 420px;">
  </div>
</div>

<body>
  <main class="wrap" role="main">
    <a class="logo" href="index.html" id="homeLogo" aria-label="Findora home">
<img src="logo.png" style="height: 220px;">
    </a>

    <div class="search-card" role="region" aria-label="Search">
      <div class="search-row">
        <input id="q" class="search-input" placeholder="What are you looking for? (e.g. weather, news, recipe...)" aria-label="Search query" autocomplete="off" />
        <button id="searchBtn" class="btn btn-primary" title="Search"><i class="fas fa-search"></i></button>
        <button id="luckyBtn" class="btn btn-muted" title="I'm Feeling Lucky">Lucky <i class="fas fa-star"></i></button>
      </div>

      <div class="controls">
        <label class="small"><input type="checkbox" id="demoToggle"> Demo results</label>
        
      </div>

      <div id="results" class="results" hidden></div>
      <div id="status" class="status" hidden></div>
    </div>

    <div style="margin-top:14px;color:var(--muted);font-size:13px;">Findora • lightweight search demo</div>
    <div id="apiHint" hidden></div>
  </main>


<script src="app.js"></script>
--<script src="loader.js"></script>

</body>
</html>
