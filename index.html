<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findora — Gələcəyin AI Axtarış Sistemi</title>
  <meta name="description"
    content="Findora - Süni intellektlə dəstəklənən axtarış sistemi. Wikipedia və DuckDuckGo ilə axtarın.">
<link rel="shortcut icon" href="logo2.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #7772FF;
      --primary-glow: rgba(119, 114, 255, 0.25);
      --primary-light: rgba(119, 114, 255, 0.08);
      --bg: #f8f9fb;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --radius: 24px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.dark-mode {
      --bg: #0a0a0f;
      --surface: #15151f;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --border: #2a2a3a;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --primary-glow: rgba(119, 114, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      overflow-x: hidden;
    }

    /* ── Top Bar ── */
    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 28px;
      gap: 12px;
    }

    .topbar-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 12px;
      transition: var(--transition);
      font-family: inherit;
      font-weight: 500;
    }

    .topbar-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .topbar-btn i {
      margin-right: 6px;
    }

    /* ── Main Container ── */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px 80px;
      animation: fadeIn 0.6s ease;
    }

    /* ── Logo ── */
    .logo {
      font-size: 76px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, #a78bfa 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -4px;
      animation: float 4s ease-in-out infinite;
      user-select: none;
    }

    .logo-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── Search Box ── */
    .search-wrapper {
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 6px 8px 6px 20px;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      transition: var(--transition);
      position: relative;
      z-index: 10;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow), var(--shadow);
      transform: translateY(-1px);
    }

    .search-box .search-icon {
      color: var(--text-muted);
      font-size: 18px;
      margin-right: 12px;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      padding: 14px 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: var(--transition);
    }

    .action-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .action-btn.recording {
      color: #ef4444;
      animation: pulse 1s infinite;
    }

    .search-submit {
      background: linear-gradient(135deg, var(--primary), #818cf8);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: var(--transition);
      font-family: inherit;
      margin-left: 4px;
    }

    .search-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* ── Suggestions Dropdown ── */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: 0 0 16px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border);
      border-top: none;
      z-index: 9;
      display: none;
      overflow: hidden;
      margin-top: -8px;
      padding-top: 8px;
    }

    .suggestions.active {
      display: block;
      animation: slideDown 0.2s ease;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 15px;
      color: var(--text);
    }

    .suggestion-item:hover {
      background: var(--primary-light);
    }

    .suggestion-item i {
      color: var(--text-muted);
      font-size: 14px;
      width: 20px;
      text-align: center;
    }

    /* ── Button Group ── */
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      font-weight: 500;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-secondary i {
      margin-right: 6px;
    }

    /* ── AI Quick Answer Box ── */
    .ai-quick {
      display: none;
      width: 100%;
      max-width: 680px;
      margin-top: 24px;
      background: var(--surface);
      border-radius: 16px;
      padding: 20px 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: slideUp 0.4s ease;
    }

    .ai-quick.active {
      display: block;
    }

    .ai-quick-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ai-quick-header .ai-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }

    .ai-quick-header span {
      font-weight: 600;
      font-size: 15px;
    }

    .ai-quick-body {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      opacity: 0.9;
    }

    .ai-quick-body strong {
      color: var(--primary);
    }

    .ai-typing {
      display: inline-block;
    }

    .ai-typing::after {
      content: '▋';
      animation: blink 0.8s infinite;
      color: var(--primary);
    }

    /* ── Recent Searches ── */
    .recent-searches {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 680px;
    }

    .recent-tag {
      background: var(--surface);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .recent-tag:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .recent-tag i {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Trending ── */
    .trending {
      margin-top: 32px;
      width: 100%;
      max-width: 680px;
    }

    .trending-header {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trending-header i {
      color: var(--primary);
    }

    .trending-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .trending-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      font-weight: 500;
    }

    .trending-item:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .trending-num {
      color: var(--primary);
      font-weight: 700;
      font-size: 16px;
      min-width: 24px;
    }

    /* ── Loader ── */
    .loader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* ── Footer ── */
    .footer {
      padding: 16px 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .logo {
        font-size: 52px;
      }

      .search-box {
        padding: 4px 6px 4px 14px;
      }

      .search-box input {
        font-size: 15px;
        padding: 12px 0;
      }

      .search-submit {
        padding: 10px 18px;
        font-size: 13px;
      }

      .trending-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 10px 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <div class="topbar">
    <button class="topbar-btn" id="themeToggle">
      <i id="theme-icon" class="fas fa-moon"></i> Tema
    </button>
  </div>

  <!-- Main -->
  <main class="main-container" id="mainContainer">
    <h1 class="logo">Findora</h1>
    <p class="logo-subtitle">Süni İntellektlə Gücləndirilmiş Axtarış</p>

    <!-- Search -->
    <div class="search-wrapper" id="searchWrapper">
      <div class="search-box" id="searchBox">
        <i class="fas fa-search search-icon"></i>
        <input id="searchInput" type="text" placeholder="Nə axtarmaq istərdiniz?" autocomplete="off"
          aria-label="Axtarış">
        <div class="search-actions">
          <button class="action-btn" id="voiceBtn" title="Səsli axtarış"><i class="fas fa-microphone"></i></button>
          <button class="action-btn" id="aiBtn" title="AI-dan soruş"><i class="fas fa-robot"></i></button>
        </div>
        <button class="search-submit" id="searchBtn">Axtar</button>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>

    <!-- Button Group -->
    <div class="btn-group">
      <button class="btn-secondary" id="luckyBtn"><i class="fas fa-magic"></i> Şanslıyam</button>
      <button class="btn-secondary" id="imageSearchBtn"><i class="fas fa-image"></i> Şəkil axtar</button>
    </div>

    <!-- AI Quick Answer -->
    <div class="ai-quick" id="aiQuick">
      <div class="ai-quick-header">
        <div class="ai-icon"><i class="fas fa-robot"></i></div>
        <span>Findora AI</span>
      </div>
      <div class="ai-quick-body" id="aiQuickBody"></div>
    </div>

    <!-- Recent Searches -->
    <div class="recent-searches" id="recentSearches"></div>

    <!-- Trending -->
    <div class="trending" id="trendingSection">
      <div class="trending-header"><i class="fas fa-fire"></i> Populyar Axtarışlar</div>
      <div class="trending-grid" id="trendingGrid"></div>
    </div>
  </main>

  <!-- Loader -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-ring"></div>
    <div class="loader-text">Axtarılır...</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    Findora © 2026 — <a href="about.html">Findora Haqqında</a> · <a href="privacy.html">Gizlilik</a> · <a href="terms.html">Şərtlər</a> · Powered by <strong>Five Apps</strong>
  </div>

  <script src="index.js" defer></script>
</body>

</html>
